name: 공식 통계 갱신

on:
  schedule:
    - cron: "17 */6 * * *"   # 6시간마다 (UTC 기준 00:17, 06:17, 12:17, 18:17)
  workflow_dispatch:          # Actions 탭에서 수동 실행
    inputs:
      force:
        description: "공식 수치가 그대로여도 다시 계산"
        type: boolean
        default: false
  push:                       # 화면이나 계산 코드를 바꾸면 다시 계산해서 배포
    branches: [main]
    paths-ignore:
      - "history/**"
      - "archive/**"
      - "data/**"
      - "README.md"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      deploy: ${{ steps.done.outputs.deploy }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main            # always start from the latest main, also for runs that waited in the queue
          fetch-depth: 50

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Pages 설정이 "GitHub Actions"면 화면용 데이터(data/)는 저장소에 두지 않고 이 작업이 배포한다.
      # 아직 "브랜치에서 배포"면 예전처럼 data/를 커밋한다(설정을 바꾸는 즉시 자동으로 넘어감).
      - name: 배포 방식 확인
        id: mode
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mode=$(curl -s -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages" | python3 -c "import sys,json; print(json.load(sys.stdin).get('build_type') or 'legacy')" || echo legacy)
          echo "Pages build type: $mode"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"

      - name: 지금 사이트의 데이터 받기
        if: steps.mode.outputs.mode == 'workflow'
        run: python tools/pull_live.py data

      # 패치 노트를 모아 버프·너프로 분류하고(meta/patches.json), 새 패치의 측정 기간이 끝났으면
      # 기본 가중치를 다시 정한다(meta/weights.json). 실패해도 통계 갱신은 계속한다.
      - name: 패치 노트 수집과 가중치 점검
        continue-on-error: true
        run: |
          python tools/patches.py
          python tools/weights.py

      - name: 넥슨·블리자드·넷이즈 통계 수집과 계산
        id: refresh
        run: |
          set -o pipefail
          python refresh.py ${{ (inputs.force || github.event_name == 'push') && '--force' || '' }} | tee refresh.log
          echo "result=$(grep -o 'RESULT: [A-Z]*' refresh.log | tail -1 | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"

      - name: 바뀐 내용 커밋
        env:
          MODE: ${{ steps.mode.outputs.mode }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "$MODE" = "workflow" ] && git ls-files --error-unmatch data/index.json >/dev/null 2>&1; then
            # the site is deployed by this workflow now: stop keeping the generated data in the repository
            git rm -r -q --cached data
            grep -qx 'data/' .gitignore || echo 'data/' >> .gitignore
            git add .gitignore
          fi
          paths="history archive meta"
          [ "$MODE" = "workflow" ] || paths="data history archive meta"
          commit_all() {
            git add $paths
            git diff --cached --quiet && return 1
            git commit -m "공식 통계 갱신 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')"
          }
          if commit_all; then
            # someone may have pushed meanwhile: rebase, or recompute on top of the latest main, and retry
            for attempt in 1 2 3; do
              git push && exit 0
              echo "push rejected (attempt $attempt), updating to the latest main"
              git fetch origin main
              if git rebase origin/main; then continue; fi
              git rebase --abort
              git reset --hard origin/main
              python refresh.py --force
              commit_all || exit 0
            done
            exit 1
          fi
          echo "통계 변동 없음"
          # GitHub는 60일 동안 저장소 활동이 없으면 예약 실행을 멈추므로, 45일간 커밋이 없으면 빈 커밋을 남긴다
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt $(( 45 * 86400 )) ]; then
            git commit --allow-empty -m "예약 실행 유지용 커밋"
            git push
          fi

      - name: 배포할 파일 모으기
        id: done
        if: steps.mode.outputs.mode == 'workflow'
        env:
          RESULT: ${{ steps.refresh.outputs.result }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$RESULT" = "UPDATED" ] || [ "$EVENT" = "push" ] || [ "$EVENT" = "workflow_dispatch" ]; then
            if [ ! -f data/index.json ]; then echo "no data to deploy"; exit 1; fi
            mkdir -p _site
            cp -r index.html assets data archive meta _site/
            touch _site/.nojekyll
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "변동 없음: 지금 배포된 사이트를 그대로 둔다"
          fi

      - uses: actions/upload-pages-artifact@v3
        if: steps.done.outputs.deploy == 'true'
        with:
          path: _site

  deploy:
    needs: refresh
    if: needs.refresh.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - id: pages
        uses: actions/deploy-pages@v4
